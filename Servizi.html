    const base = 'display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; font-size: 15px; font-weight: 700; cursor: pointer; ';
    const on = base + 'background: #06331B; color: #FFFFFF; border: 1.5px solid #06331B';
    const off = base + 'background: #FFFFFF; color: #10251A; border: 1.5px solid #C9D6CE';
    const tabs = [['tutti','Ambiente e sicurezza'],['amb','Solo ambiente'],['sic','Solo salute e sicurezza']].map(([id,label]) => ({
      label, style: a === id ? on : off, pressed: a === id ? 'true' : 'false', pick: () => this.setState({ ambito: id })
    }));
    return { tabs, showAmb: a !== 'sic', showSic: a !== 'amb' };
  }
}
