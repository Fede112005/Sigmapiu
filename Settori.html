<noscript>Questa pagina richiede JavaScript per i contenuti interattivi.</noscript>
<script src="assets/dc-lite.js"></script>
<script>
window.Component = class extends DCLogic {
  constructor(p){ super(p); this.state = { sel: 0 }; }
  renderVals() {
    const S = [
      ['Gestori di impianti rifiuti','Impianti di recupero e smaltimento con autorizzazioni articolate, prescrizioni da rispettare e materiali in uscita da valorizzare.',
        ['Autorizzazioni degli impianti e rispetto delle prescrizioni','Gestione rifiuti e RENTRI'],
        ['Monitoraggi ambientali previsti dall\'autorizzazione','Assistenza tecnica in caso di controlli'],
        ['End of Waste e valorizzazione dei materiali in uscita','Strategie autorizzative per modifiche e nuove linee']],
      ['Manifatturiero','Produzione e lavorazioni con processi complessi, emissioni e più flussi di rifiuti.',
        ['Autorizzazioni AUA o AIA e rispetto delle prescrizioni','Gestione rifiuti e RENTRI'],
        ['Monitoraggi di emissioni e scarichi','Sistemi di gestione ISO 9001 e 14001'],
        ['Sottoprodotti e valorizzazione degli scarti','PPWR e requisiti ambientali richiesti dalle filiere']],
      ['Edilizia e materiali da costruzione','Cantieri, impianti di produzione e rifiuti da costruzione e demolizione, con richieste ambientali crescenti in gare e filiere.',
        ['Rifiuti da C&D e terre e rocce da scavo','Autorizzazioni ambientali e adempimenti'],
        ['Audit ambientali di cantiere e di stabilimento','Monitoraggi ambientali'],
        ['End of Waste per aggregati riciclati','Strategie autorizzative, VIA e screening per nuovi impianti']],
      ['Metallurgia','Fonderie e lavorazioni dei metalli, con emissioni da controllare e scorie e sabbie da gestire e valorizzare.',
        ['Autorizzazioni AIA o AUA e rispetto delle prescrizioni','Classificazione e gestione dei rifiuti di processo'],
        ['Monitoraggi delle emissioni','Audit ambientali e verifiche di conformità'],
        ['Sottoprodotti ed End of Waste per scorie e sabbie','Valorizzazione di scarti e materiali']]
    ];
    const sel = this.state.sel;
    const base = 'display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 22px; border-radius: 14px; text-align: left; cursor: pointer; min-height: 132px; ';
    const tiles = S.map((s, i) => ({ name: s[0], desc: s[1], pressed: sel === i ? 'true' : 'false',
      style: base + (sel === i ? 'background: #06331B; color: #FFFFFF; border: 1.5px solid #06331B' : 'background: #FFFFFF; color: #10251A; border: 1.5px solid #DCE5DF'),
      descStyle: 'font-size: 15px; line-height: 1.45; ' + (sel === i ? 'color: #D3E6DA' : 'color: #52645A'),
      pick: () => this.setState({ sel: i }) }));
    const cur = S[sel];
    const L = a => a.map(t => ({ t }));
    return { tiles, cur: { name: cur[0], desc: cur[1], g: L(cur[2]), b: L(cur[3]), o: L(cur[4]) } };
  }
}
</script>
