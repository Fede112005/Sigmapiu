<script>
window.Component = class extends DCLogic {
  constructor(p){ super(p); this.state = { open: 0 }; }
  renderVals() {
    const faqs = [
      ['Quanto dura un audit?', 'Dipende da numero di siti, attività e ambiti inclusi. Lo definiamo nel kick-off, dopo un primo esame della documentazione.'],
      ['Serve fermare la produzione?', 'No. Sopralluoghi e interviste si pianificano con i responsabili per non interferire con l\'operatività.'],
      ['Cosa succede se emergono non conformità?', 'Le classifichiamo per gravità e urgenza e le traduciamo in un piano d\'azione con responsabili e tempi. Se serve, ti accompagniamo nella risoluzione.'],
      ['L\'audit vale come certificazione?', 'No: è una verifica di parte seconda. Prepara però in modo concreto a una certificazione ISO 14001 e a eventuali ispezioni.']
    ];
    return { faqs: faqs.map(([q,a], i) => ({ q, a, isOpen: this.state.open === i, expanded: this.state.open === i ? 'true' : 'false', sign: this.state.open === i ? '−' : '+', toggle: () => this.setState({ open: this.state.open === i ? -1 : i }) })) };
  }
}
</script>
